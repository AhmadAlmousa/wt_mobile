# The Flutter template asks for -Xmx8G and 4G of metaspace. This machine has
# 5G of RAM in total, so the daemon was being killed by the kernel partway
# through `assembleRelease` — reported by Gradle as "build daemon disappeared
# unexpectedly", which reads like a crash and is really a heap it was never
# going to be given. Sized to what is actually here; a project this small has
# never come close to needing more.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
