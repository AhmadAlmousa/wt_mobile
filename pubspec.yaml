name: webtrees_mobile
description: "A mobile client for webtrees genealogy sites."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# Keep in step with `kAppVersion` in lib/core/webtrees_client.dart, which puts
# this number in the User-Agent every request carries. Site administrators read
# that string in their logs, so it has to name the build they actually have.
version: 0.21.0+24

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0
  flutter_secure_storage: ^11.0.0
  local_auth: ^3.0.2
  go_router: ^17.5.0
  # DOM parsing for Phase 3. Stock webtrees has no API, so records are read
  # out of HTML fragments; selectors survive theme and version drift far
  # better than the regexes used for the protocol spike.
  html: ^0.15.6
  meta: ^1.18.0
  shared_preferences: ^2.5.5
  flutter_localizations:
    sdk: flutter
  intl: any
  # Sharing a chart. A family tree is drawn to be shown to the family, and a
  # screenshot of a phone-sized window is not the chart.
  #
  # `pdf` is pure Dart, and the chart is drawn into it again as shapes rather
  # than photographed: a family chart is the kind of document somebody prints
  # large, and a raster page has already decided how large that can be. It
  # embeds the app's own Cairo face and runs the bidirectional algorithm
  # itself, which is what makes an Arabic chart a real document rather than a
  # picture of one. `share_plus` hands the file to whatever the reader already
  # uses, and `path_provider` says where a temporary file may live.
  pdf: ^3.13.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  # Keeping the tree on the device (Phase 10). `sync_eval.md` §9 chose Drift
  # over ObjectBox for one reason that is not speed: its store *is* SQLite, a
  # format a server could one day write, and ObjectBox's is not — so this
  # choice leaves a door open that the faster one closes forever. The data is
  # relational (people, families, links, facts), a chart is a recursive walk
  # and a filter is a `WHERE`, which is SQL's home ground.
  #
  # `drift_flutter` is only the platform glue: it says where the file lives and
  # opens it with `NativeDatabase.createInBackground`, so every query runs on
  # its own isolate rather than on the one drawing the screen.
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  # Direct rather than transitive since Phase 10c: the store is opened with a
  # `PRAGMA key`, which is this package's API, and the encrypted build is
  # selected through this package's own build hooks (see `hooks:` below).
  sqlite3: ^3.5.2
  # Saying where the store file is, so it can be deleted on sign-out without
  # opening it first.
  path: ^1.9.0
  # Whether the first sync should run now or wait (Phase 10c).
  #
  # A first sync is ~5 MB over the wire, which is nothing on wifi and is
  # somebody else's data plan on a cellular network. This is the only way to
  # tell the two apart, and it also reports the *change* — which is what makes
  # "it will download next time you are on wifi" a promise the app can keep
  # rather than one the reader has to come back and collect.
  #
  # Deliberately a hint and never a gate: the reader can always start it now.
  connectivity_plus: ^7.3.1

# Encryption at rest for the local store (Phase 10c).
#
# `sync_eval.md` §6 #3 calls this "a decision to take before the first byte is
# written, not after", and it is the gate the whole phase sat behind: putting
# 1,463 records on a device is a real change in exposure, because until now the
# app held only what it had fetched, in RAM.
#
# `sqlite3` 3.5.2 ships pre-compiled SQLite3MultipleCiphers binaries alongside
# the plain ones, verified by sha256 from its own sources, so this is a
# *selection* rather than a native build — no toolchain step, no per-ABI
# compilation, nothing new in CI. That is why the route named in §6 (build
# hooks) turned out to cost almost nothing.
#
# `sqlite3mc` rather than `sqlcipher`: the SQLCipher build links OpenSSL on
# Android, Linux and Windows and lags upstream SQLite, where this one carries
# the current SQLite and needs no OpenSSL. Both answer `PRAGMA key`.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  # The one honest cost of Drift, named in `sync_eval.md` §9 before it was
  # accepted: this project had no code generation until now. `dart run
  # build_runner build` regenerates `lib/data/local/store.g.dart`, and CI has
  # to run it — a generated file that disagrees with its source is a failure
  # nothing else catches.
  drift_dev: ^2.34.5
  build_runner: ^2.15.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generates lib/l10n/app_localizations.dart from the ARB files.
  generate: true

  fonts:
    # Cairo (SIL Open Font License 1.1 — assets/fonts/Cairo-OFL.txt) covers
    # Arabic and Latin in one family, so the interface keeps its voice in
    # both directions instead of falling back to a system face for Arabic.
    # Instanced from the upstream variable font at five static weights:
    # a variable font would need `fontVariations` on every style, which any
    # widget calling `copyWith(fontWeight:)` would silently ignore.
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
