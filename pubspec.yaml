name: webtrees_mobile
description: "A mobile client for webtrees genealogy sites."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# Keep in step with `kAppVersion` in lib/core/webtrees_client.dart, which puts
# this number in the User-Agent every request carries. Site administrators read
# that string in their logs, so it has to name the build they actually have.
version: 0.16.0+18

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0
  flutter_secure_storage: ^11.0.0
  local_auth: ^3.0.2
  go_router: ^17.5.0
  # DOM parsing for Phase 3. Stock webtrees has no API, so records are read
  # out of HTML fragments; selectors survive theme and version drift far
  # better than the regexes used for the protocol spike.
  html: ^0.15.6
  meta: ^1.18.0
  shared_preferences: ^2.5.5
  flutter_localizations:
    sdk: flutter
  intl: any
  # Sharing a chart. A family tree is drawn to be shown to the family, and a
  # screenshot of a phone-sized window is not the chart.
  #
  # `pdf` is pure Dart, and the chart is drawn into it again as shapes rather
  # than photographed: a family chart is the kind of document somebody prints
  # large, and a raster page has already decided how large that can be. It
  # embeds the app's own Cairo face and runs the bidirectional algorithm
  # itself, which is what makes an Arabic chart a real document rather than a
  # picture of one. `share_plus` hands the file to whatever the reader already
  # uses, and `path_provider` says where a temporary file may live.
  pdf: ^3.13.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generates lib/l10n/app_localizations.dart from the ARB files.
  generate: true

  fonts:
    # Cairo (SIL Open Font License 1.1 — assets/fonts/Cairo-OFL.txt) covers
    # Arabic and Latin in one family, so the interface keeps its voice in
    # both directions instead of falling back to a system face for Arabic.
    # Instanced from the upstream variable font at five static weights:
    # a variable font would need `fontVariations` on every style, which any
    # widget calling `copyWith(fontWeight:)` would silently ignore.
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
